<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        h1 {
            margin: 0;
            color: #2c3e50;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .card h3 {
            margin: 0 0 10px;
            color: #7f8c8d;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #2c3e50;
        }

        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .status-ok {
            color: #27ae60;
        }

        .status-err {
            color: #c0392b;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>System Monitor</h1>
            <p>Real-time metrics from /metrics</p>
        </header>

        <div class="cards">
            <div class="card">
                <h3>Total Requests</h3>
                <div class="value" id="totalReq">0</div>
            </div>
            <div class="card">
                <h3>Error Rate</h3>
                <div class="value" id="errorRate">0%</div>
            </div>
            <div class="card">
                <h3>Avg Latency</h3>
                <div class="value" id="avgLatency">0ms</div>
            </div>
            <div class="card">
                <h3>Uptime (Approx)</h3>
                <div class="value" id="uptime">0s</div>
            </div>
        </div>

        <div class="charts">
            <div class="chart-container">
                <canvas id="reqChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="latencyChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Chart Config
        const maxPoints = 20;
        const ctxReq = document.getElementById('reqChart').getContext('2d');
        const ctxLat = document.getElementById('latencyChart').getContext('2d');

        const reqChart = new Chart(ctxReq, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Requests / 5s',
                    data: [],
                    borderColor: '#3498db',
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(52, 152, 219, 0.1)'
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } }, animation: false }
        });

        const latChart = new Chart(ctxLat, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Avg Latency (s)',
                    data: [],
                    borderColor: '#e67e22',
                    tension: 0.4,
                    fill: false
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } }, animation: false }
        });

        let lastTotalReq = 0;

        async function fetchMetrics() {
            try {
                const response = await fetch('/metrics');
                const text = await response.text();
                parseMetrics(text);
            } catch (err) {
                console.error("Failed to fetch metrics", err);
            }
        }

        function parseMetrics(text) {
            const lines = text.split('\n');
            let httpTotal = 0;
            let httpSum = 0;
            let httpCount = 0;
            let processUptime = 0;

            // Regex approximations for standard prometheus-fastapi-instrumentator metrics
            // http_requests_total{handler="/predict",method="POST",status="2xx"} 10.0

            lines.forEach(line => {
                if (line.startsWith('#')) return;

                if (line.includes('http_requests_total')) {
                    const val = parseFloat(line.split(' ').pop());
                    if (!isNaN(val)) httpTotal += val;
                }

                if (line.includes('http_request_duration_seconds_sum')) {
                    const val = parseFloat(line.split(' ').pop());
                    if (!isNaN(val)) httpSum += val;
                }

                if (line.includes('http_request_duration_seconds_count')) {
                    const val = parseFloat(line.split(' ').pop());
                    if (!isNaN(val)) httpCount += val;
                }

                if (line.includes('process_cpu_seconds_total')) {
                    // Just as an activity signal
                }
            });

            // Update Cards
            document.getElementById('totalReq').innerText = Math.round(httpTotal);

            const avgLat = httpCount > 0 ? (httpSum / httpCount) : 0;
            document.getElementById('avgLatency').innerText = (avgLat * 1000).toFixed(1) + 'ms';

            // Error Rate Calculation (Very rough approximation, assumes we count all requests)
            // Real implementation would parse status codes from tags
            // For now, let's keep it simple or parsing tags would be complex in regex-free JS

            // Charts Update
            const now = new Date().toLocaleTimeString();

            // Request Rate (Delta)
            const deltaReq = httpTotal - lastTotalReq;
            // First run adjustment
            const currentReqRate = lastTotalReq === 0 ? 0 : deltaReq;
            lastTotalReq = httpTotal;

            addData(reqChart, now, currentReqRate);
            addData(latChart, now, avgLat);
        }

        function addData(chart, label, data) {
            chart.data.labels.push(label);
            chart.data.datasets.forEach((dataset) => {
                dataset.data.push(data);
            });
            if (chart.data.labels.length > maxPoints) {
                chart.data.labels.shift();
                chart.data.datasets.forEach((dataset) => {
                    dataset.data.shift();
                });
            }
            chart.update();
        }

        // Init
        setInterval(fetchMetrics, 5000);
        fetchMetrics();
    </script>
</body>

</html>
